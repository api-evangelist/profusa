aid: profusa
name: Profusa
description: 'Profusa, Inc. (Nasdaq: PFSA) is a South San Francisco digital-health and
  medical-device company that builds tissue-integrated biosensors — injectable, biologically
  compatible hydrogel microsensors smaller than a grain of rice — for continuous, real-time
  monitoring of body chemistry. Its Lumee Oxygen Platform reports tissue oxygen for
  peripheral artery disease, chronic wounds and reconstructive surgery, and a long-duration
  Lumee glucose sensor is in development. A companion Data Platform turns raw sensor
  readings into clinical intelligence for clinicians, with EMR integration described as
  planned rather than shipped. Profusa has received more than USD 23M in NIH and DARPA
  funding and became publicly traded in July 2025 through a business combination with
  NorthView Acquisition Corporation. As of this profiling pass the company publishes no
  developer program, no public API documentation and no machine-readable API contract.'
